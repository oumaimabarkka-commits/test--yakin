<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8" />
<title>Carte Fournisseurs Île-de-France</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 15px;
    background: #f4f4f4;
}

.header {
    display: flex;
    align-items: center;
    background: white;
    padding: 10px 20px;
    border-radius: 8px;
    margin-bottom: 15px;
    gap: 20px;
}

.header img {
    height: 50px;
}

#map {
    height: 600px;
    border-radius: 8px;
}

.filters {
    background: white;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-radius: 8px;
}

select, input {
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #ddd;
}

/* LEGEND */
.legend {
    background: white;
    padding: 10px;
    border-radius: 8px;
    width: 260px;
    max-height: 500px;
    overflow-y: auto;
}

.legend b.title {
    font-size: 13px;
    display: block;
    margin-bottom: 8px;
    color: #d10000;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}

.legend span:hover {
    background: #f0f0f0;
}

.legend-logo {
    width: 20px;
    height: 20px;
    object-fit: contain;
}

.legend-color-box {
    width: 14px;
    height: 14px;
    border-radius: 3px;
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png">
    <h2>Carte Fournisseurs Île-de-France</h2>
</div>

<div class="filters">

<select id="filtreNom" onchange="filtrer()">
<option value="">Fournisseur : Tous</option>
</select>

<select id="filtreVille" onchange="filtrer()">
<option value="">Ville : Toutes</option>
</select>

<select id="filtreCP" onchange="filtrer()">
<option value="">CP : Tous</option>
</select>

<select id="filtreProduit" onchange="filtrer()">
<option value="">Produit : Tous</option>
</select>

<input type="range" id="filtreRayon" min="0" max="50" value="0" oninput="filtrer()">

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>

var map = L.map('map').setView([48.85,2.35],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var markers = [];
var villesCoords = {};
var cercleRayon = null;
var legendControl = null;

var codesCouleurs = {
"Loxam":"blue",
"Cemex":"grey",
"Point P":"red",
"Raboni":"green",
"Fransbonhomme":"violet",
"Clim plus":"orange",
"LARIVIERE":"blue"
};

var logosMap = {
"Loxam":"https://loxam.com/wp-content/uploads/2022/08/logo-loxam-rental.png",
"Cemex":"https://findlogovector.com/wp-content/uploads/2018/12/cemex-logo-vector.png",
"Point P":"Point P.png",
"Raboni":"https://produits.batiactu.com/img/indus_auto/350-350-c/20200422_160646-raboni_2020.jpg"
};

function normalize(t){
return (t||"").toString().toLowerCase().trim();
}

function getIcon(color){
return new L.Icon({
iconUrl:`https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
shadowUrl:'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34],
shadowSize:[41,41]
});
}

fetch("data.csv")
.then(r=>r.text())
.then(csv=>{
Papa.parse(csv,{
header:true,
complete:function(res){

let frs=new Set(), vls=new Set(), cps=new Set(), prs=new Set();

res.data.forEach(row=>{

let lat=parseFloat(row["latitude (fournisseur)"]);
let lng=parseFloat(row["longitude (fournisseur)"]);

if(!lat||!lng) return;

let f = row["fournisseur"]?.trim();

let m=L.marker([lat,lng]).bindPopup(f);
m.data=row;

markers.push(m);
m.addTo(map);

frs.add(f);
vls.add(row["ville"]);
cps.add(row["CP"]);
prs.add(row["Produit"]);

});

fill("filtreNom",frs);
fill("filtreVille",vls);
fill("filtreCP",cps);
fill("filtreProduit",prs);

addLegend();

}
});
});

function fill(id,set){
let s=document.getElementById(id);
set.forEach(v=>{
if(v){
let o=document.createElement("option");
o.value=v;
o.textContent=v;
s.appendChild(o);
}
});
}

/* 🔥 LEGEND UPDATED */
function addLegend(){

if(legendControl) map.removeControl(legendControl);

legendControl=L.control({position:'bottomright'});

legendControl.onAdd=function(){

let div=L.DomUtil.create('div','legend');

div.innerHTML="<b class='title'>FOURNISSEURS</b>";

let prod=normalize(filtreProduit.value);
let set=new Set();

markers.forEach(m=>{
let d=m.data;

if(!prod || normalize(d.Produit)==prod){
set.add((d.fournisseur||"").toUpperCase());
}
});

Array.from(set).sort().forEach(f=>{
let span=document.createElement("span");

let icon = logosMap[f]
? `<img src="${logosMap[f]}" class="legend-logo">`
: `<div class="legend-color-box"></div>`;

span.innerHTML = `${icon} ${f}`;

span.onclick=()=>{
filtreNom.value=f;
filtrer();
};

div.appendChild(span);
});

return div;
};

legendControl.addTo(map);
}

function filtrer(){
let nom=normalize(filtreNom.value);
let ville=normalize(filtreVille.value);
let cp=normalize(filtreCP.value);
let prod=normalize(filtreProduit.value);

markers.forEach(m=>{
let d=m.data;
let ok=true;

if(nom && normalize(d.fournisseur)!=nom) ok=false;
if(ville && normalize(d.ville)!=ville) ok=false;
if(cp && normalize(d.CP)!=cp) ok=false;
if(prod && normalize(d.Produit)!=prod) ok=false;

if(ok) m.addTo(map);
else map.removeLayer(m);
});

addLegend();
}

</script>

</body>
</html>
