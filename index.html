<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Les fournisseurs de YAKIN TP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body { font-family: Arial; }

#map { height: 600px; margin-top:10px; }

.header {
    text-align:center;
}

.header img {
    height:80px;
}

.filters {
    margin:10px 0;
}

select {
    padding:5px;
    margin-right:10px;
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png">
    <h1>Les fournisseurs de YAKIN TP</h1>
</div>

<div class="filters">
    <select id="filterFournisseur">
        <option value="">Tous les fournisseurs</option>
    </select>

    <select id="filterProduit">
        <option value="">Tous les produits</option>
    </select>

    <select id="filterVille">
        <option value="">Toutes les villes</option>
    </select>

    <select id="filterCP">
        <option value="">Tous les CP</option>
    </select>
</div>

<div id="map"></div>

<script>

var map = L.map('map').setView([48.7, 2.3], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

var markers = [];
var colors = {};

function getColor(name){
    if(!colors[name]){
        colors[name] = "#" + Math.floor(Math.random()*16777215).toString(16);
    }
    return colors[name];
}

Papa.parse("data.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results){

        var data = results.data;

        var fournisseurs = new Set();
        var produits = new Set();
        var villes = new Set();
        var cps = new Set();

        data.forEach(row => {

            var lat = parseFloat(row["Latitude"]?.replace(",", "."));
            var lng = parseFloat(row["Longitude"]?.replace(",", "."));

            if(!isNaN(lat) && !isNaN(lng)){

                fournisseurs.add(row["fournisseurs"]);
                produits.add(row["produit"]);
                villes.add(row["ville"]);
                cps.add(row["CP"]);

                var marker = L.circleMarker(
                    [lat, lng],
                    {color: getColor(row["fournisseurs"]), radius:8}
                ).addTo(map);

                marker.bindPopup(
                    "<b>" + row["Nom de l'agence"] + "</b><br>" +
                    row["adresse complete"] + "<br>" +
                    "Ville: " + row["ville"] + "<br>" +
                    "CP: " + row["CP"] + "<br>" +
                    "Produit: " + row["produit"] + "<br>" +
                    "Email: " + row["email"]
                );

                marker.data = row;
                markers.push(marker);
            }
        });

        function fillSelect(id, values){
            var select = document.getElementById(id);
            values.forEach(v=>{
                if(v){
                    var option = document.createElement("option");
                    option.value = v;
                    option.textContent = v;
                    select.appendChild(option);
                }
            });
        }

        fillSelect("filterFournisseur", fournisseurs);
        fillSelect("filterProduit", produits);
        fillSelect("filterVille", villes);
        fillSelect("filterCP", cps);

    }
});

function filterMarkers(){

    var f = document.getElementById("filterFournisseur").value;
    var p = document.getElementById("filterProduit").value;
    var v = document.getElementById("filterVille").value;
    var c = document.getElementById("filterCP").value;

    markers.forEach(marker=>{

        var d = marker.data;

        var show =
        (f=="" || d["fournisseurs"]==f) &&
        (p=="" || d["produit"]==p) &&
        (v=="" || d["ville"]==v) &&
        (c=="" || d["CP"]==c);

        if(show){
            marker.addTo(map);
        } else {
            map.removeLayer(marker);
        }
    });
}

document.querySelectorAll("select").forEach(select=>{
    select.addEventListener("change", filterMarkers);
});

</script>

</body>
</html>
